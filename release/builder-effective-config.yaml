directories:
  output: release
  buildResources: assets
appId: com.xiaohongshu.autopublish
productName: 小红书自动发布插件
files:
  - filter:
      - dist/main/**/*
      - dist/renderer/**/*
      - node_modules/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 小红书自动发布插件
mac:
  target:
    - dmg
    - zip
linux:
  target:
    - AppImage
    - deb
electronVersion: 27.3.11
